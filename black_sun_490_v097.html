<style>
  html, body { margin:0; padding:0; background:#050505; color:#39ff14; font-family: monospace; overflow:hidden; touch-action:none; }
  #wrap { margin-top: 20px;  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; height:100vh; }
  canvas { background:#000; width:100vw; max-width:900px; height:auto; image-rendering: pixelated; border:2px solid #39ff14; box-sizing:border-box; }

  #fire { grid-column: 1; grid-row: 1 / span 2; }
  #up { grid-column: 3; grid-row: 1; }
  #left { grid-column: 2; grid-row: 2; }
  #right { grid-column: 4; grid-row: 2; }
  #down { grid-column: 3; grid-row: 3; }
  #menu { grid-column: 5; grid-row: 1 / span 2; }
  #burner { grid-column: 5; grid-row: 3; }
  #hint { font-size:12px; color:#9cff8e; padding-bottom:4px; text-align:center; }
</style>
</head>

// Procedural Atari-style sound system. No external assets.
let audioCtx = null, masterGain = null, audioUnlocked = false;
function audioContext(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.30;
    masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  audioUnlocked = true;
  return audioCtx;
}
function audioNow(){ return audioContext().currentTime; }
function tone(freq, start, dur, type='square', gain=0.16, endFreq=null){
  const c=audioContext();
  const o=c.createOscillator();
  const g=c.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,start);
  if(endFreq!==null) o.frequency.linearRampToValueAtTime(endFreq,start+dur);
  g.gain.setValueAtTime(0.0001,start);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain),start+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  o.connect(g); g.connect(masterGain);
  o.start(start); o.stop(start+dur+0.03);
}
function noise(start,dur,gain=0.16,filterFreq=1200,filterType='bandpass'){
  const c=audioContext();
  const buffer=c.createBuffer(1,Math.ceil(c.sampleRate*dur),c.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
  const src=c.createBufferSource(); src.buffer=buffer;
  const filter=c.createBiquadFilter(); filter.type=filterType; filter.frequency.value=filterFreq;
  const g=c.createGain();
  g.gain.setValueAtTime(gain,start);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  src.connect(filter); filter.connect(g); g.connect(masterGain);
  src.start(start); src.stop(start+dur+0.03);
}

function nearestStation(x,y){ let best=stations[0], bd=1e9; for(const s of stations){ const d=Math.hypot(x-s.x,y-s.y); if(d<bd){bd=d; best=s;} } return best; }
function stationAtPlayer(){ return stations.find(s => Math.hypot(player.x-s.x, player.y-s.y)<18) || null; }
function jumpAtPlayer(){ return jumpPoints.find(j => Math.hypot(player.x-j.x, player.y-j.y)<20) || null; }
function useJump(j){

function distanceToSegment(px,py,x1,y1,x2,y2){
  const vx=x2-x1, vy=y2-y1, wx=px-x1, wy=py-y1;
  const c1=wx*vx+wy*vy, c2=vx*vx+vy*vy;
  const t=clamp(c1/c2,0,1);
  const bx=x1+t*vx, by=y1+t*vy;
  return Math.hypot(px-bx, py-by);
}
function inAsteroidBelt(x,y){ return distanceToSegment(x,y,asteroidBelt.x1,asteroidBelt.y1,asteroidBelt.x2,asteroidBelt.y2) < asteroidBelt.width; }
const MAX_STATION_DISTANCE = (()=>{ let m=1; for(const a of stations) for(const b of stations) m=Math.max(m, Math.hypot(a.x-b.x,a.y-b.y)); return m; })();
function cargoPayout(from, to){
  const d = Math.hypot(from.x-to.x, from.y-to.y);
  const scaled = MIN_CARGO_REWARD + (MAX_CARGO_REWARD - MIN_CARGO_REWARD) * (d / MAX_STATION_DISTANCE);
  return Math.min(MAX_CARGO_REWARD, Math.ceil(scaled / 500) * 500);
}


function sideOfBelt(st){
  const ax=asteroidBelt.x1, ay=asteroidBelt.y1, bx=asteroidBelt.x2, by=asteroidBelt.y2;
  return Math.sign((bx-ax)*(st.y-ay) - (by-ay)*(st.x-ax));
}
function contractTier(current, dest){
  const sameSide = sideOfBelt(current) === sideOfBelt(dest);
  const normalized = dist(current, dest) / MAX_STATION_DISTANCE;
  if(sameSide && normalized < 0.42) return "short";
  if(normalized < 0.68) return "medium";
  return "long";
}

function contractPayoutFor(current, dest, tier, pool){
  const range = CONTRACT_PAYOUTS[tier];
  if(!range) return cargoPayout(current, dest);
  let distances = pool.map(s => dist(current, s));
  let minD = Math.min(...distances);
  let maxD = Math.max(...distances);
  let t = maxD === minD ? 0.5 : (dist(current, dest) - minD) / (maxD - minD);
  return Math.round((range[0] + t * (range[1] - range[0])) / 100) * 100;
}


function diisCargoPayout(current, dest){
  const d = dist(current, dest);
  const target = stations.find(s => s.name === "Maybell");
  const ref = target ? dist(current, target) : MAX_STATION_DISTANCE;
  const t = Math.max(0.55, Math.min(1.15, d / ref));
  return Math.round((20000 * t) / 100) * 100;
}

function generateContractOptions(){
  if(!game.currentStation) return [];
  const current = game.currentStation;
  if(current.diis){
    const pool = stations.filter(s => !s.depot && !s.diis);
    const shuffled = pool.slice().sort(()=>Math.random()-0.5);
    const picks = shuffled.slice(0, Math.min(3, shuffled.length));
    return picks.map(dest => {
      const mod = 0.9 + Math.random()*0.2;
      const payout = Math.round((diisCargoPayout(current,dest) * mod) / 100) * 100;
      return { tier:"diis", destination:dest, payout:payout };
    });
  }
  const byTier = { short:[], medium:[], long:[] };
  for(const s of stations){
    if(s.name === current.name || s.depot || s.diis || current.depot) continue;
    byTier[contractTier(current, s)].push(s);
  }
  function pick(tier, fallback){
    const pool = byTier[tier].length ? byTier[tier] : fallback;
    const dest = pool[Math.floor(Math.random()*pool.length)];
    return { tier, destination:dest, payout:contractPayoutFor(current, dest, tier, pool) };
  }
  const all = stations.filter(s => s.name !== current.name && !s.depot && !s.diis);
  return [pick("short", all), pick("medium", all), pick("long", all)];
}

function generateBountyOption(){
  const margin=70;
  let target;
  for(let i=0;i<100;i++){
    target = { x: margin + Math.random()*(W-margin*2), y: 80 + Math.random()*(H-120) };
    const tooCloseStation = stations.some(s => Math.hypot(target.x-s.x,target.y-s.y)<65);
    const tooCloseJump = jumpPoints.some(j => Math.hypot(target.x-j.x,target.y-j.y)<55);
    if(!tooCloseStation && !tooCloseJump) break;
  }
  const diis = stations.find(s=>s.diis) || {x:0,y:H};
  const d = Math.hypot(target.x-diis.x,target.y-diis.y);
  const mod = 0.9 + Math.random()*0.2;
  const payout = Math.round((15000 * mod * Math.max(0.85, Math.min(1.25, d/520))) / 100) * 100;
  return { x:target.x, y:target.y, payout:payout, active:false };
}

function showNotice(title, body){
  if(title === "BOUNTY POSTED") snd.bountyActive(); else snd.notice();
  const notice = { title:title, body:body, armedAt:performance.now()/1000 + 3, wasReleased:false };
  if(deferredCombatNotices){ deferredCombatNotices.push(notice); return; }
  if(modalNotice){ noticeQueue.push(notice); return; }
  modalNotice = notice;
  consumeAction();
}
function releaseDeferredCombatNotices(){
  if(!deferredCombatNotices || !deferredCombatNotices.length){ deferredCombatNotices = null; return; }
  noticeQueue = deferredCombatNotices.concat(noticeQueue);
  deferredCombatNotices = null;
  advanceNoticeQueue();
}
function advanceNoticeQueue(){
  if(modalNotice || !noticeQueue.length) return;
  modalNotice = noticeQueue.shift();
  modalNotice.armedAt = performance.now()/1000 + 0.35;
  modalNotice.wasReleased = false;
  consumeAction();
}
function drawNotice(){
  if(!modalNotice) return;
  ctx.fillStyle="rgba(0,0,0,0.72)";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#020802";
  ctx.fillRect(105,175,590,245);
  ctx.strokeStyle="#39ff14";
  ctx.lineWidth=3;
  ctx.strokeRect(105,175,590,245);
  text(modalNotice.title, W/2, 225, 28, "center");
  const words = modalNotice.body.split(" ");
  let line = "", y = 280;
  for(const word of words){
    const test = line ? line + " " + word : word;
    if(test.length > 44){
      text(line, W/2, y, 18, "center");
      y += 30;
      line = word;
    } else line = test;
  }
  if(line) text(line, W/2, y, 18, "center");
  const wait = Math.max(0, (modalNotice.armedAt||0) - performance.now()/1000);
  if(wait<=0) text("Press FIRE to continue", W/2, 380, 18, "center");
}
function handleNoticeInput(){
  if(!modalNotice) return false;

  const now = performance.now()/1000;
  const pressed = actionPressed();

  // Always swallow input while a modal is up so the underlying screen cannot
  // accidentally react to FIRE/ENTER.
  if(!pressed) modalNotice.wasReleased = true;

  // During the cooldown, button presses do nothing except get consumed.
  if(now < (modalNotice.armedAt||0)){
    if(pressed) consumeAction();
    return true;
  }

  // After the cooldown, close on the first clean press that happened after a
  // release. This works for keyboard, mouse, and touch without requiring a
  // second hidden state elsewhere.
  if(modalNotice.wasReleased && pressed){
    consumeAction();
    modalNotice = null;
    advanceNoticeQueue();
    return true;
  }

  return true;
}

function recordTurn(label){
  game.totalTurns = (game.totalTurns||0) + 1;
  const gunnerMsg = payGunner() + (game.hasTargeting ? " Targeting -" + targetingCost() + "." : "");
  if(game.debt <= 0 && game.arrears <= 0){
    game.debt = 0;
    game.arrears = 0;
    show(label + ". Ship paid off." + gunnerMsg);
    maybeTriggerSmugglerContact();
    return;
  }
  game.turnCount++;
  if(game.turnCount >= game.nextPaymentTurn){
    processDebtPayment();
    if(game.debt > 0 || game.arrears > 0) game.nextPaymentTurn += DEBT_PAYMENT_EVERY_TURNS;
    if(gunnerMsg) show("Turn " + game.turnCount + "." + gunnerMsg);
  } else {
    show(label + ". Turn " + game.turnCount + ". Payment due in " + (game.nextPaymentTurn-game.turnCount) + "." + gunnerMsg);
  }
  maybeTriggerSmugglerContact();
}
function processDebtPayment(){
  if(game.debt <= 0){ show("Debt cleared"); return; }
  game.debt = Math.ceil(game.debt * (1 + DEBT_INTEREST_RATE));
  const due = Math.min(debtPayment(), game.debt);
  const paid = Math.min(game.credits, due);
  game.credits -= paid;
  game.debt -= paid;
  const shortfall = due - paid;
  if(shortfall > 0){
    game.arrears += shortfall;
    show("Debt payment short " + shortfall + ". Arrears " + game.arrears);
  } else {
    game.arrears = Math.max(0, game.arrears - debtPayment());
    show("Debt payment -" + paid + ". Debt " + game.debt);
  }
  checkDebtPaidOff();
  if(game.arrears >= DEFAULT_LIMIT){
    game.gameOver=true;
    game.gameOverReason="default";
    game.gameOverCuePlayed=false; game.screen="gameover";
  }
}
function makeEarlyPayment(){
  if(game.debt <= 0 && game.arrears <= 0){ show("Debt already cleared"); return; }
  if(game.credits < debtPayment()){ show("Need " + debtPayment() + " credits"); return; }
  let payment = debtPayment();
  game.credits -= payment;
  if(game.arrears > 0){
    const towardArrears = Math.min(game.arrears, payment);
    game.arrears -= towardArrears;
    payment -= towardArrears;
  }
  const towardDebt = Math.min(game.debt, payment);
  game.debt -= towardDebt;
  game.turnCount = 0;
  game.nextPaymentTurn = DEBT_PAYMENT_EVERY_TURNS;
  show("Early payment -" + debtPayment() + ". Schedule reset.");
  checkDebtPaidOff();
}
function checkDebtPaidOff(){
  if(!game.paidOffCelebrated && game.debt <= 0 && game.arrears <= 0){

  }
}

function makeCombatRocks(p, e){
  const rocks = [];
  let tries = 0;
  while(rocks.length < COMBAT_ROCK_COUNT && tries < 300){
    tries++;
    const r = COMBAT_ROCK_MIN_R + Math.random() * (COMBAT_ROCK_MAX_R - COMBAT_ROCK_MIN_R);
    const rock = { x: 55 + Math.random() * (W - 110), y: 90 + Math.random() * (H - 150), r };
    const tooCloseToPlayer = Math.hypot(rock.x - p.x, rock.y - p.y) < r + 85;
    const tooCloseToEnemy = Math.hypot(rock.x - e.x, rock.y - e.y) < r + 65;
    const tooCloseToRock = rocks.some(other => Math.hypot(rock.x - other.x, rock.y - other.y) < r + other.r + 35);
    if(!tooCloseToPlayer && !tooCloseToEnemy && !tooCloseToRock) rocks.push(rock);
  }
  return rocks;
}

function createEscapeWindow(){
  const edge = Math.floor(Math.random()*4); // 0 top, 1 right, 2 bottom, 3 left
  const minLen = 95;
  const maxLen = edge === 0 || edge === 2 ? W * 0.22 : (H-40) * 0.22;
  const len = Math.max(minLen, maxLen);
  if(edge === 0 || edge === 2){
    const start = 35 + Math.random() * (W - 70 - len);
    return { edge, start, end:start+len };
  } else {
    const start = 65 + Math.random() * (H - 105 - len);
    return { edge, start, end:start+len };
  }
}
function inEscapeWindow(o){
  const w = combat.escapeWindow;
  if(!w) return false;
  if(w.edge === 0 && o.y < 40 && o.x >= w.start && o.x <= w.end) return true;
  if(w.edge === 2 && o.y > H && o.x >= w.start && o.x <= w.end) return true;
  if(w.edge === 3 && o.x < 0 && o.y >= w.start && o.y <= w.end) return true;
  if(w.edge === 1 && o.x > W && o.y >= w.start && o.y <= w.end) return true;
  return false;
}
function wrapCombatPlayer(o){
  if(o.x < 0) o.x += W;
  if(o.x > W) o.x -= W;
  if(o.y < 40) o.y = H;
  if(o.y > H) o.y = 40;
}

function randomEnemySpawn(playerObj, enemyRadius=12){
  const minDist = 185;
  let spawn = null;
  for(let i=0;i<120;i++){
    const candidate = { x:120+Math.random()*560, y:80+Math.random()*420 };
    if(Math.hypot(candidate.x-playerObj.x, candidate.y-playerObj.y) >= minDist + enemyRadius) return candidate;
    spawn = candidate;
  }
  // Fallback: put the hostile near a far corner rather than on top of the player.
  const corners = [
    {x:120,y:80}, {x:680,y:80}, {x:120,y:500}, {x:680,y:500}
  ];
  corners.sort((a,b)=>Math.hypot(b.x-playerObj.x,b.y-playerObj.y)-Math.hypot(a.x-playerObj.x,a.y-playerObj.y));
  return corners[0] || spawn || {x:680,y:500};
}
function farthestExitAngleFrom(o){
  const exits=[{x:o.x,y:40},{x:o.x,y:H},{x:0,y:o.y},{x:W,y:o.y}];
  exits.sort((a,b)=>Math.hypot(b.x-o.x,b.y-o.y)-Math.hypot(a.x-o.x,a.y-o.y));
  return angleTo(o, exits[0]);
}

function startExplosionOutcome(type, x, y, now){
  if(type==='victory' || type==='crashed' || type==='playerDead') snd.explosion();

  combat.explosion = { x:x, y:y, start:now, duration:0.85, particles:[] };

    const a = Math.random()*Math.PI*2;

    combat.explosion.particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0.65+Math.random()*0.35 });
  }

function finishExplosionOutcome(now){
  if(!combat || !combat.pendingOutcome) return;
  const type = combat.pendingOutcome;
  if(type==="victory"){
    refreshShields();
    deferredCombatNotices = [];
    if(combat && combat.bounty && game.bounty){
      const completedTier = game.bounty.tier || 1;
      game.credits += game.bounty.payout; snd.payout(); checkWealthHeat();
      game.combatOutcome="bountyVictory"; snd.combatVictory();
      // Notice order after the result screen: bounty tier notices, heat notices, then drops.
      recordBountySuccess(completedTier);
      addHeat(2 + completedTier, "bounty victory");
      processCombatDrops("bounty", completedTier);
      game.bounty=null;
    } else if(combat && combat.hunter){
      game.combatOutcome="hunterEscaped"; snd.flee();
      // Hades hunters break contact before destruction. No cash reward.
    } else {
      game.credits += FIGHTER_BOUNTY; snd.payout(); checkWealthHeat();
      game.combatOutcome="victory"; snd.combatVictory();
      // Notice order after the result screen: heat notices, then drops.
      addHeat(1, "pirate kill");

    }
    game.lastEncounterTime = now + PIRATE_RESPAWN_COOLDOWN_SECONDS - ENCOUNTER_COOLDOWN_SECONDS;
    game.screen="combatOutcome";
    game.encounterMoveCooldown = 2;
    combat=null;
   } else if(type==="crashed"){
    refreshShields();
    game.lastEncounterTime = now + PIRATE_RESPAWN_COOLDOWN_SECONDS - ENCOUNTER_COOLDOWN_SECONDS;
    game.screen="combatOutcome";
    if(combat && combat.bounty){
      if(game.bounty) recordBountyFailure(game.bounty.tier || 1);
      game.combatOutcome="bountyFailed"; snd.ambush();
      game.bounty=null;
    } else if(combat && combat.hunter){
      game.combatOutcome="hunterEscaped"; snd.flee();
    } else {
      game.combatOutcome="crashed"; snd.ambush();
    }
    game.encounterMoveCooldown = 2;
    combat=null;
  } else if(type==="playerDead"){
    game.gameOver=true;
    game.gameOverReason="ship";
    game.gameOverCuePlayed=false; game.screen="gameover";
    combat=null;
  }
}

  else if(o.phase==="leftSide"){ o.targetX=115; o.targetY=90+(H-230)*(0.5+0.5*Math.sin(t*1.25)); }

  releaseDeferredCombatNotices();
 } return; }

  if(game.screen==="bountyAlert") { playOnceFlag('alertCuePlayed', ()=>snd.ambush()); if(actionPressed()){ snd.menuConfirm(); consumeAction(); game.screen="combat"; } }
  if(game.screen==="hunterAlert") { playOnceFlag('alertCuePlayed', ()=>snd.bountyActive()); if(actionPressed()){ snd.menuConfirm(); consumeAction(); game.screen="combat"; } }

function updateMap(dt, now){
  let mx=0,my=0;
  if(keys.b || keys.Shift){
    keys.b=false; keys.Shift=false;
    if(game.hasAfterburner){ game.afterburnerOn=!game.afterburnerOn; snd.takeoff(); show("Afterburner " + (game.afterburnerOn?"ON":"OFF")); }
    else show("No afterburner installed");
  }
  if(keys.ArrowLeft||keys.a) mx-=1; if(keys.ArrowRight||keys.d) mx+=1; if(keys.ArrowUp||keys.w) my-=1; if(keys.ArrowDown||keys.s) my+=1;
  const moving = mx||my;
  if(game.radarAlertPopup){
    if(actionPressed()){ consumeAction(); game.radarAlertPopup=false; show("Evasive action!"); }
    return;
  }
  if(game.radarWarning && moving){
    game.radarWarningTime -= dt;
    if(game.radarWarningTime <= 0){
      game.radarWarning=false;
      if(game.hasAfterburner && game.afterburnerOn){
        game.pendingAmbush=false;
        game.encounterMoveCooldown = 2;
        snd.escape(); show("Ambush outrun");
      } else if(game.pendingAmbush){
        const ambushType = game.pendingAmbush;
        game.pendingAmbush=false;
        if(ambushType === "hunter") startHunterCombat();
        else startCombat();
        return;
      }
    }
  }
  if(moving){
    const len=Math.hypot(mx,my)||1; const speed = (game.hasAfterburner && game.afterburnerOn) ? 120 : 80; player.x += (mx/len)*speed*dt; player.y += (my/len)*speed*dt;
    player.x=clamp(player.x,10,W-10); player.y=clamp(player.y,40,H-10);
    game.fuel -= FUEL_DRAIN_PER_SECOND*difficulty.fuelMult*shieldFuelPenalty()*((game.hasAfterburner && game.afterburnerOn)?3.00:1)*dt;
    game.encounterMoveCooldown = Math.max(0, game.encounterMoveCooldown - dt);

  if(st && actionPressed()){ game.currentStation=st; game.contractOptions=st.depot ? null : generateContractOptions(); game.contractMenu=false; game.afterburnerOn=false; game.radarWarning=false; game.pendingAmbush=false; game.radarAlertPopup=false; game.ambushBonus=0; game.screen=st.depot ? "depot" : "station"; menuIndex=0; consumeAction(); recordTurn("Landed"); maybeShowBlackrockSmugglerOffer(); return; }
  if(jp && actionPressed()){ consumeAction(); useJump(jp); return; }
  const inBelt = inAsteroidBelt(player.x, player.y);
  if(!inBelt) game.ambushBonus = 0;
  if(moving && game.playerBounty && !game.radarWarning && game.encounterMoveCooldown <= 0 && now - (game.lastHunterTime||-99) > HADES_HUNTER_COOLDOWN_SECONDS){
    game.lastHunterTime = now;
    game.encounterMoveCooldown = 2;
    const usingBurner = game.hasAfterburner && game.afterburnerOn;
    const hunterChanceBase = inBelt ? HADES_HUNTER_BELT_CHANCE : HADES_HUNTER_OPEN_SPACE_CHANCE;
    const hunterChance = usingBurner ? hunterChanceBase * 0.45 : hunterChanceBase;
    if(Math.random() < hunterChance){
      if(game.hasRadar){
        game.radarWarning=true;
        game.radarWarningTime=2;
        game.pendingAmbush="hunter";
        game.radarAlertPopup=true; snd.radar();
      } else {
        startHunterCombat(); return;
      }
    }
  }
  if(moving && !game.radarWarning && game.encounterMoveCooldown <= 0 && now - game.lastEncounterTime > ENCOUNTER_COOLDOWN_SECONDS && inBelt){
    game.lastEncounterTime=now;
    game.encounterMoveCooldown = 2;
    const usingBurner = game.hasAfterburner && game.afterburnerOn;
    const chance = usingBurner ? (ENCOUNTER_CHANCE * 0.40) : Math.min(0.95, ENCOUNTER_CHANCE + game.ambushBonus);
    if(Math.random()<chance){
      game.ambushBonus = 0;

  }

  const debtCleared = game.debt <= 0 && game.arrears <= 0;
  const hasStealthOption = !!(st.diis && game.schematicUnlocked && !game.hasStealthPackage);
  const actions = ["contract","deliver","refuel","repair"];
  if(!debtCleared) actions.push("early");
  if(st.diis && game.playerBounty) actions.push("payBounty");
  if(st.diis) actions.push("bounty");
  if(hasStealthOption) actions.push("stealth");
  if(st.name === "Blackrock" && game.playerBounty && game.smugglerOffered) actions.push("smuggler");
  actions.push("launch");
  const optionCount = actions.length;
  if(menuIndex >= optionCount) menuIndex = optionCount-1;
  if(keys.ArrowUp||keys.w){ menuIndex=(menuIndex+optionCount-1)%optionCount; keys.ArrowUp=keys.w=false; }
  if(keys.ArrowDown||keys.s){ menuIndex=(menuIndex+1)%optionCount; keys.ArrowDown=keys.s=false; }
  if(actionPressed()){
    consumeAction();
    const action = actions[menuIndex];
    if(action==="contract") takeContract();
    else if(action==="deliver") deliverCargo();
    else if(action==="refuel") refuel();
    else if(action==="repair") repair();
    else if(action==="early") makeEarlyPayment();
    else if(action==="payBounty") payOffPlayerBounty();
    else if(action==="bounty") openBountyMenu();
    else if(action==="stealth"){ game.stealthPopup=true; menuIndex=0; }
    else if(action==="smuggler") takeSmugglerEscape();
    else { game.screen="map";
 game.currentStation=null; game.contractMenu=false; game.bountyMenu=false; snd.takeoff(); show("Launched"); }
  }
}

function angleTo(a,b){ return Math.atan2(b.y-a.y,b.x-a.x); }
function wrap(o){ if(o.x<0)o.x+=W; if(o.x>W)o.x-=W; if(o.y<40)o.y=H; if(o.y>H)o.y=40; }

function bountyAsteroidAvoidance(e, targetAngle){
  if(!combat || !combat.bounty || !combat.rocks || !combat.rocks.length || e.fleeing) return targetAngle;
  let nearest = null, nearestDist = 99999;
  for(const rock of combat.rocks){
    const d = Math.hypot(e.x-rock.x, e.y-rock.y);
    if(d < nearestDist){ nearest = rock; nearestDist = d; }
  }
  if(!nearest) return targetAngle;
  const dangerRadius = nearest.r + e.r + (e.bountyType==="heavy" ? 62 : 42);
  if(nearestDist > dangerRadius) return targetAngle;
  const away = angleTo(nearest, e);
  const targetWeight = Math.max(0.25, nearestDist / dangerRadius);
  const x = Math.cos(targetAngle)*targetWeight + Math.cos(away)*(1-targetWeight);
  const y = Math.sin(targetAngle)*targetWeight + Math.sin(away)*(1-targetWeight);
  return Math.atan2(y,x);
}

function updateCombat(dt, now){
  const p=combat.player, e=combat.enemy;
  if(combat.explosion){
    for(const part of combat.explosion.particles){ part.x += part.vx*dt; part.y += part.vy*dt; part.vx*=0.96; part.vy*=0.96; part.life -= dt; }
    if(now - combat.explosion.start >= combat.explosion.duration){ finishExplosionOutcome(now); }
    return;
  }
  if(keys.ArrowLeft||keys.a) p.angle -= 3.5*dt;
  if(keys.ArrowRight||keys.d) p.angle += 3.5*dt;
  if(keys.ArrowUp||keys.w){ p.vx += Math.cos(p.angle)*120*dt; p.vy += Math.sin(p.angle)*120*dt; }
  p.vx*=0.995; p.vy*=0.995; p.x+=p.vx*dt; p.y+=p.vy*dt;
  if(p.x<0 || p.x>W || p.y<40 || p.y>H){
    if(inEscapeWindow(p)){ endCombatEscape("player"); return; }
    wrapCombatPlayer(p);
  }
  if(actionPressed() && now - p.lastShot >= SHOT_COOLDOWN_SECONDS){ p.lastShot=now; combat.bullets.push({x:p.x,y:p.y,vx:Math.cos(p.angle)*220,vy:Math.sin(p.angle)*220,life:2}); snd.pew(); }
  if(game.hasTurret && game.gunnerPaid && (now - combat.startTime) >= 2 && now - combat.turretLastShot >= 0.75){
    combat.turretLastShot = now;
    let ta;
if(game.hasTargeting){
  const openSpace = !combat.rocks || combat.rocks.length===0;
  const lead = openSpace ? 0.18 : 0.25;
  const dx=e.x-p.x;
  const dy=e.y-p.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const px=e.x+e.vx*lead;
  const py=e.y+e.vy*lead;
  const minSpread = openSpace ? 0.12 : 0.08;
  const maxSpread = openSpace ? 0.40 : 0.26;
  const spreadScale=Math.min(dist/400,1);
  const spread=(Math.random()-0.5)*(minSpread+(maxSpread-minSpread)*spreadScale);
  ta=angleTo(p,{x:px,y:py}) + spread;
}else{
  ta=angleTo(p,e);
}
    combat.bullets.push({x:p.x,y:p.y,vx:Math.cos(ta)*308.3,vy:Math.sin(ta)*308.3,life:2, turret:true}); snd.pew();
  }
  const combatAge = now - combat.startTime;
  const pirateCanMove = combatAge >= 0.5;
  const pirateCanShoot = combatAge >= 1.5;
  const enemyDormant = (e.alerted === false);
  if(enemyDormant){
    e.vx*=0.98; e.vy*=0.98;
  } else if(e.fleeing){
    if(pirateCanMove){
      e.angle = e.fleeAngle;
      e.vx += Math.cos(e.angle)*118.75*dt; e.vy += Math.sin(e.angle)*118.75*dt;
      if(isOffscreen(e, 28)){ endCombatEscape("pirate"); return; }
    }
  } else {
    const target = bountyAsteroidAvoidance(e, angleTo(e,p)); let diff = Math.atan2(Math.sin(target-e.angle), Math.cos(target-e.angle));
    if(pirateCanMove){
      const turnRate=(e.bountyType==="heavy")?1.15:((e.bountyType==="medium"||e.bountyType==="hades")?1.5:2.15); e.angle += clamp(diff, -turnRate*dt, turnRate*dt);
      const moveAccel=(e.bountyType==="heavy")?42:(e.bountyType==="hades"?58:((e.bountyType==="medium")?55:(e.pirateVariant==="fast"?82:68.75))); e.vx += Math.cos(e.angle)*moveAccel*dt; e.vy += Math.sin(e.angle)*moveAccel*dt;
    } else {
      e.angle = target;
    }
    if(e.bountyType==="hades"){
      if(pirateCanShoot && now - e.lastShot > 0.85){
        e.lastShot=now;
        for(const off of [-0.18,-0.06,0.06,0.18]){
          const a = e.angle + off;
          combat.enemyBullets.push({x:e.x+Math.cos(a)*10,y:e.y+Math.sin(a)*10,vx:Math.cos(a)*250,vy:Math.sin(a)*250,life:2.6});
        }
      }
    } else {
      const enemyShotInterval = combat.bounty ? 0.6 : PIRATE_SHOT_INTERVAL;
      if(e.hasTurret && pirateCanShoot && now - e.turretLastShot > 0.9){ const ta=angleTo(e,p); e.turretLastShot=now; combat.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(ta)*240,vy:Math.sin(ta)*240,life:2.5}); }
      if(pirateCanShoot && now - e.lastShot > enemyShotInterval){ e.lastShot=now; combat.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(e.angle)*231.25,vy:Math.sin(e.angle)*231.25,life:2.4}); }
    }
  }
  e.vx*=0.995; e.vy*=0.995; e.x+=e.vx*dt; e.y+=e.vy*dt; if(!e.fleeing) wrap(e);
  for(const rock of combat.rocks){
    if(Math.hypot(p.x-rock.x,p.y-rock.y)<p.r+rock.r){
      game.hp-=COLLISION_DAMAGE;
      p.vx *= -0.45; p.vy *= -0.45;
      const push = angleTo(rock,p);
      p.x = rock.x + Math.cos(push) * (p.r + rock.r + 2);
      p.y = rock.y + Math.sin(push) * (p.r + rock.r + 2);
      snd.hullHit();
      show("Rock collision!");
      if(game.hp<=0){ startExplosionOutcome("playerDead", p.x, p.y, now); return; }
    }
    if(Math.hypot(e.x-rock.x,e.y-rock.y)<e.r+rock.r){
      if(combat.bounty || combat.hunter){
        const push = angleTo(rock,e);
        e.x = rock.x + Math.cos(push) * (e.r + rock.r + 3);
        e.y = rock.y + Math.sin(push) * (e.r + rock.r + 3);
        e.vx = Math.cos(push) * 45;
        e.vy = Math.sin(push) * 45;
        e.angle = push;
        snd.hullHit();
        show("Target scrapes past a rock!");
      } else {
        endCombatNoBounty(now, "Pirate hit a rock. No bounty.");
        return;
      }
    }
  }
  updateBullets(combat.bullets, dt); updateBullets(combat.enemyBullets, dt);
  for(const b of combat.bullets){ if(b.life>0 && Math.hypot(b.x-e.x,b.y-e.y)<e.r){
    b.life=0;
    if(e.alerted === false){ e.alerted = true; show("Target alerted!"); }
    if(e.bountyType==="hades" && e.fleeing){
      show("Hades 6 is breaking away!");
      continue;
    }
    if(e.shields && e.shields>0){
      e.shields--;
      snd.shieldHit();
      show("Target shield hit");
    }
    else {
      e.hp--;
      snd.hullHit();
      show(e.bountyType==="hades" ? "Hit Hades 6" : (combat.bounty ? "Hit target" : "Hit pirate"));
    }
    if(e.bountyType==="hades" && e.hp<=1){
      e.hp = 1;
      if(!e.fleeing){
        e.fleeing=true;
        e.fleeAngle=farthestExitAngleFrom(e);
        e.vx = Math.cos(e.fleeAngle) * 95;
        e.vy = Math.sin(e.fleeAngle) * 95;
        snd.flee();
        show("Hades 6 is breaking off!");
      }
      continue;
    }
    if(e.hp<=0){ endCombatVictory(now); return; }
    if(e.hp===1 && !e.fleeing && !e.noFlee && Math.random()<0.25){
      e.fleeing=true;
      e.fleeAngle=farthestExitAngleFrom(e);
      snd.flee(); show("Pirate is fleeing!");
    }
  } }
  for(const b of combat.enemyBullets){ if(b.life>0 && Math.hypot(b.x-p.x,b.y-p.y)<p.r){
    b.life=0;
    if(game.shields > 0){ game.shields--; snd.shieldHit(); show("Shield hit"); }
    else { game.hp--; snd.hullHit(); show("Hull hit"); if(game.hp<=0){ startExplosionOutcome("playerDead", p.x, p.y, now); return; } }
  } }
  if(Math.hypot(p.x-e.x,p.y-e.y)<p.r+e.r){ game.hp-=COLLISION_DAMAGE; e.hp-=COLLISION_DAMAGE; snd.hullHit(); show("Collision!"); if(game.hp<=0){ startExplosionOutcome("playerDead", p.x, p.y, now); return; } if(e.hp<=0){ endCombatVictory(now); return; } }
}

function shipShape(o, color){
  ctx.save();
  ctx.translate(o.x,o.y);
  ctx.rotate(o.angle);
  ctx.strokeStyle=color;
  ctx.fillStyle=color;
  ctx.lineWidth=2;
  ctx.lineJoin="round";
  ctx.lineCap="round";

  if(color==="#39ff14"){
    // Black Sun 490 player ship from external SVG.
    // The SVG is drawn nose-up. The extra PI/2 keeps it aligned with the
    // combat angle system, where angle 0 means flying right and -PI/2 means up.
    ctx.rotate(Math.PI/2);
    const drawH = 66;
    const drawW = drawH * (80.171545 / 87.412167);
    if(playerShipImg.complete && playerShipImg.naturalWidth > 0){
      ctx.drawImage(playerShipImg, -drawW/2, -drawH/2, drawW, drawH);
    } else {
      // Fallback only while the embedded SVG image finishes decoding.
      ctx.lineWidth=2.4;
      ctx.beginPath();
      ctx.moveTo(0, -32);
      ctx.lineTo(-22, 15);
      ctx.lineTo(-5, 13);
      ctx.lineTo(-5, 21);
      ctx.moveTo(0, -32);
      ctx.lineTo(22, 15);
      ctx.lineTo(5, 13);
      ctx.lineTo(5, 21);
      ctx.moveTo(-9, 13);
      ctx.lineTo(9, 13);
      ctx.stroke();
    }

  } else {
    // Pirate / bounty fighter from supplied SVG paths.
    ctx.rotate(Math.PI/2);
    ctx.strokeStyle=color;
    ctx.fillStyle="none";

    const isBountySmall = combat && combat.bounty && o.bountyType==="small";
    const isBountyMedium = combat && combat.bounty && o.bountyType==="medium";
    const isBountyHeavy = combat && combat.bounty && o.bountyType==="heavy";
    const isHadesHunter = combat && combat.hunter && o.bountyType==="hades";
    const isFastPirate = o.pirateVariant === "fast";

    if(isFastPirate && pirateTwoImg.complete){
      ctx.save();
      // Image art is already nose-up; the shared enemy transform above
      // rotates it into the game's angle system. Do not double-rotate.
      ctx.drawImage(pirateTwoImg, -19, -26, 38, 52);
      ctx.restore();
    } else if(isBountyHeavy){
      ctx.lineWidth=2.6;
      ctx.save();
      ctx.scale(0.95,0.95);
      ctx.translate(-bountyHeavyShipSvgTransform.vbW/2, -bountyHeavyShipSvgTransform.vbH/2);
      ctx.translate(bountyHeavyShipSvgTransform.x, bountyHeavyShipSvgTransform.y);
      for(const path of bountyHeavyShipPaths) ctx.stroke(path);
      ctx.restore();
    } else if(isHadesHunter){
      if(hadesShipImg.complete){
        ctx.save();
        // Hades 6 hunter: same general footprint as the medium bounty target, forced red in the embedded SVG.
        ctx.drawImage(hadesShipImg, -25, -25, 50, 50);
        ctx.restore();
      } else {
        ctx.lineWidth=2.2;
        ctx.save();
        ctx.scale(0.72,0.72);
        ctx.translate(-bountyMediumShipSvgTransform.vbW/2, -bountyMediumShipSvgTransform.vbH/2);
        ctx.translate(bountyMediumShipSvgTransform.x, bountyMediumShipSvgTransform.y);
        for(const path of bountyMediumShipPaths) ctx.stroke(path);
        ctx.restore();
      }
    } else if(isBountyMedium){
      ctx.lineWidth=2.04;
      ctx.save();
      ctx.scale(0.7,0.7);
      ctx.translate(-bountyMediumShipSvgTransform.vbW/2, -bountyMediumShipSvgTransform.vbH/2);
      ctx.translate(bountyMediumShipSvgTransform.x, bountyMediumShipSvgTransform.y);
      for(const path of bountyMediumShipPaths) ctx.stroke(path);
      ctx.restore();
    } else if(isBountySmall){
      ctx.lineWidth=1.52;
      ctx.save();
      ctx.scale(0.55, 0.55);
      ctx.translate(-bountySmallShipSvgTransform.vbW/2, -bountySmallShipSvgTransform.vbH/2);
      ctx.translate(bountySmallShipSvgTransform.x, bountySmallShipSvgTransform.y);
      for(const path of bountySmallShipPaths) ctx.stroke(path);
      ctx.restore();
    } else {
      ctx.lineWidth=0.73;
      ctx.save();
      ctx.scale(2.2, 2.2);
      ctx.translate(-8.04, -8.03);
      ctx.translate(pirateShipSvgTransform.x, pirateShipSvgTransform.y);
      for(const path of pirateShipPaths) ctx.stroke(path);
      ctx.restore();
    }
  }

  ctx.restore();
}

function drawCombat(){ drawHud(); const p=combat.player,e=combat.enemy;
  ctx.strokeStyle="#39ff14"; ctx.lineWidth=3;
  ctx.strokeRect(2,42,W-4,H-44);
  const ew = combat.escapeWindow;
  const flashRed = Math.floor(performance.now()/250) % 2 === 0;
  ctx.strokeStyle= flashRed ? "#f55" : "#39ff14"; ctx.lineWidth=6;
  ctx.beginPath();
  if(ew.edge===0){ ctx.moveTo(ew.start,42); ctx.lineTo(ew.end,42); }
  else if(ew.edge===2){ ctx.moveTo(ew.start,H-2); ctx.lineTo(ew.end,H-2); }
  else if(ew.edge===3){ ctx.moveTo(2,ew.start); ctx.lineTo(2,ew.end); }
  else { ctx.moveTo(W-2,ew.start); ctx.lineTo(W-2,ew.end); }
  ctx.stroke();
  drawCombatStars();
  ctx.strokeStyle="#777"; ctx.lineWidth=2;
  for(const rock of combat.rocks){
    ctx.beginPath();
    ctx.arc(rock.x, rock.y, rock.r, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rock.x-rock.r*0.5, rock.y);
    ctx.lineTo(rock.x+rock.r*0.35, rock.y-rock.r*0.25);
    ctx.lineTo(rock.x+rock.r*0.15, rock.y+rock.r*0.45);
    ctx.stroke();
  }
  if(combat.explosion){
    const age = (performance.now()/1000) - combat.explosion.start;
    ctx.fillStyle="#fff";
    for(const part of combat.explosion.particles){
      if(part.life>0) ctx.fillRect(part.x-2,part.y-2,4,4);
    }
    ctx.strokeStyle="#fff"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(combat.explosion.x, combat.explosion.y, 8 + age*60, 0, Math.PI*2); ctx.stroke();
    return;
  }
  shipShape(p,"#39ff14");
  shipShape(e,"#f55");

  // Shields draw on top of ships for visibility.
  if(game.shields > 0){
    ctx.save();
    ctx.globalAlpha=0.85;
    ctx.strokeStyle="#4db8ff";
    ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.arc(p.x,p.y,(27 + game.shields*3)*1.15,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  if(e.shields && e.shields > 0){
    ctx.save();
    ctx.globalAlpha=0.9;
    ctx.strokeStyle="#4db8ff";
    ctx.lineWidth=2.5;
    ctx.beginPath();
    const baseShield = (e.bountyType==="heavy") ? 50 : (e.bountyType==="hades" ? 42 : 33);
    const scaleShield = (e.bountyType==="heavy") ? 7 : (e.bountyType==="hades" ? 5 : 4);
    ctx.arc(e.x,e.y,baseShield + e.shields*scaleShield,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  text((combat.hunter ? "HADES 6" : (combat.bounty ? "TARGET" : "PIRATE")) + " HP " + e.hp + ((e.shields&&e.shields>0) ? " SHD " + e.shields : "") + (e.fleeing ? "  FLEEING" : ""), 12, 45, 16);
  for(const b of combat.bullets){ ctx.fillStyle=b.turret?"#ffdf5a":"#39ff14"; ctx.fillRect(b.x-2,b.y-2,4,4); }
  ctx.fillStyle="#f55"; for(const b of combat.enemyBullets) ctx.fillRect(b.x-2,b.y-2,4,4);
}
